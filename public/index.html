<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة الوطن لتعليم القيادة</title>
<style>
  :root {
    --ink: #1B2126;
    --ink-soft: #3A434B;
    --paper: #F6F3EC;
    --paper-dim: #EDE8DB;
    --route: #E9B93E;
    --olive: #4F6F52;
    --olive-soft: #E4EAE2;
    --rust: #B3492B;
    --rust-soft: #F3E0D8;
    --line: rgba(27,33,38,.14);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Tajawal', Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    padding: 0 0 40px 0;
  }
  .navbar {
    background: var(--ink);
    padding: 14px 20px;
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
  }
  .navbar a {
    color: var(--paper);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }
  .navbar a:hover { color: var(--route); }
  .navbar .brand {
    color: var(--route);
    font-size: 16px;
    font-weight: 800;
    margin-left: auto;
  }

  .container { max-width: 620px; margin: 0 auto; padding: 0 18px; }

  .hero {
    background: var(--ink);
    color: var(--paper);
    border-radius: 0 0 20px 20px;
    padding: 32px 24px;
    margin-bottom: 26px;
    text-align: center;
  }
  .hero h1 { font-size: 26px; margin: 0 0 8px 0; font-weight: 800; }
  .hero p { font-size: 14px; color: var(--route); margin: 0; }

  h2 {
    font-size: 17px;
    margin: 28px 0 12px 0;
    font-weight: 800;
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 12px;
  }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--ink-soft);
  }
  input, select {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 1.5px solid var(--line);
    font-family: inherit;
    font-size: 15px;
    margin-bottom: 16px;
    background: #fff;
  }
  input:focus, select:focus {
    outline: 2px solid var(--route);
    border-color: var(--route);
  }

  button {
    background: var(--ink);
    color: var(--route);
    border: none;
    border-radius: 11px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    width: 100%;
    cursor: pointer;
    font-family: inherit;
    transition: transform .12s ease;
  }
  button:active { transform: scale(.98); }

  .price-box {
    background: var(--paper-dim);
    padding: 14px;
    border-radius: 9px;
    text-align: center;
    font-weight: 800;
    font-size: 17px;
    margin-bottom: 16px;
  }

  .booking-item {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 15px 17px;
    margin-bottom: 10px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .booking-info .t { font-weight: 700; margin-bottom: 3px; }
  .booking-info .s { font-size: 12.5px; color: var(--ink-soft); }

  .cancel-btn {
    background: var(--rust);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    width: auto;
    flex-shrink: 0;
    font-family: inherit;
  }

  .msg { padding: 13px; border-radius: 9px; margin-bottom: 16px; display: none; font-size: 14px; font-weight: 700; }
  .msg.success { background: var(--olive-soft); color: var(--olive); display: block; }
  .msg.error { background: var(--rust-soft); color: var(--rust); display: block; }

  .empty { color: var(--ink-soft); font-size: 14px; padding: 18px; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
</style>
</head>
<body>

<div class="navbar">
  <a href="/">الرئيسية</a>
  <a href="/login.html">دخول الطالب</a>
  <a href="/dashboard.html">حسابي</a>
  <a href="/admin.html">الإدارة</a>
  <span class="brand">🚗 مدرسة الوطن</span>
</div>

<div class="hero">
  <h1>مدرسة الوطن لتعليم القيادة</h1>
  <p>احجز درسك بسهولة • أوتوماتيك • جير • شحن خفيف</p>
</div>

<div class="container">
  <h2>احجز درسك</h2>
  <div class="card">
    <div id="message" class="msg"></div>

    <label>اسمك</label>
    <input type="text" id="studentName" placeholder="مثال: محمد أحمد">

    <label>نوع الرخصة</label>
    <select id="lessonType" onchange="updatePrice()">
      <option value="automatic">أوتوماتيك</option>
      <option value="manual">جير</option>
      <option value="heavy">شحن خفيف</option>
    </select>

    <label>المعلم</label>
    <select id="teacherSelect"><option>جاري التحميل...</option></select>

    <label>التاريخ</label>
    <input type="date" id="lessonDate">

    <label>الوقت</label>
    <input type="time" id="lessonTime">

    <div class="price-box" id="priceBox">السعر: 110 ₪</div>

    <button onclick="submitBooking()">تأكيد الحجز</button>
  </div>

  <h2>تسجيل طالب جديد</h2>
  <div class="card">
    <div id="studentMessage" class="msg"></div>

    <label>الاسم</label>
    <input type="text" id="newStudentName" placeholder="مثال: أحمد يوسف">

    <label>رقم الموبايل</label>
    <input type="tel" id="newStudentPhone" placeholder="0599123456">

    <label>نوع الرخصة</label>
    <select id="newStudentType">
      <option value="automatic">أوتوماتيك</option>
      <option value="manual">جير</option>
      <option value="heavy">شحن خفيف</option>
    </select>

    <button onclick="registerStudent()">تسجيل</button>
  </div>

  <h2>الحجوزات الحالية</h2>
  <div id="bookingsList">جاري التحميل...</div>

  <h2>الطلاب المسجلون</h2>
  <div id="studentsList">جاري التحميل...</div>
</div>

<script>
const typeNames = { automatic: 'أوتوماتيك', manual: 'جير', heavy: 'شحن خفيف' };

function updatePrice() {
  const type = document.getElementById('lessonType').value;
  const price = type === 'heavy' ? 130 : 110;
  document.getElementById('priceBox').textContent = `السعر: ${price} ₪`;
}

async function loadTeachers() {
  const res = await fetch('/api/teachers');
  const teachers = await res.json();
  document.getElementById('teacherSelect').innerHTML = teachers
    .map(t => `<option value="${t.id}">${t.name}</option>`).join('');
}

async function loadBookings() {
  const res = await fetch('/api/bookings');
  const bookings = await res.json();

  document.getElementById('bookingsList').innerHTML = bookings.length === 0
    ? '<div class="empty">ما في حجوزات بعد</div>'
    : bookings.map(b => `
      <div class="booking-item">
        <div class="booking-info">
          <div class="t">${b.student_name} — ${typeNames[b.lesson_type]}</div>
          <div class="s">${b.date} • ${b.time} • ${b.price} ₪</div>
        </div>
        <button class="cancel-btn" onclick="cancelBooking(${b.id})">إلغاء</button>
      </div>
    `).join('');
}

async function submitBooking() {
  const student_name = document.getElementById('studentName').value.trim();
  const lesson_type = document.getElementById('lessonType').value;
  const teacher_id = document.getElementById('teacherSelect').value;
  const date = document.getElementById('lessonDate').value;
  const time = document.getElementById('lessonTime').value;
  const msgEl = document.getElementById('message');

  if (!student_name || !date || !time) {
    msgEl.className = 'msg error';
    msgEl.textContent = 'يرجى تعبئة كل الحقول';
    return;
  }

  const res = await fetch('/api/bookings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ teacher_id, student_name, lesson_type, date, time })
  });

  const result = await res.json();
  if (result.success) {
    msgEl.className = 'msg success';
    msgEl.textContent = `تم الحجز بنجاح! المبلغ: ${result.price} ₪`;
    document.getElementById('studentName').value = '';
    loadBookings();
  }
}

async function cancelBooking(id) {
  if (!confirm('متأكد بدك تلغي هالحجز؟')) return;
  await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
  loadBookings();
}

async function registerStudent() {
  const name = document.getElementById('newStudentName').value.trim();
  const phone = document.getElementById('newStudentPhone').value.trim();
  const license_type = document.getElementById('newStudentType').value;
  const msgEl = document.getElementById('studentMessage');

  if (!name || !phone) {
    msgEl.className = 'msg error';
    msgEl.textContent = 'يرجى تعبئة الاسم ورقم الموبايل';
    return;
  }

  const res = await fetch('/api/students', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, phone, license_type })
  });

  const result = await res.json();
  if (result.success) {
    msgEl.className = 'msg success';
    msgEl.textContent = 'تم تسجيل الطالب بنجاح!';
    document.getElementById('newStudentName').value = '';
    document.getElementById('newStudentPhone').value = '';
    loadStudents();
  } else {
    msgEl.className = 'msg error';
    msgEl.textContent = result.message;
  }
}

async function loadStudents() {
  const res = await fetch('/api/students');
  const students = await res.json();

  document.getElementById('studentsList').innerHTML = students.length === 0
    ? '<div class="empty">ما في طلاب مسجلين بعد</div>'
    : students.map(s => `
      <div class="booking-item">
        <div class="booking-info">
          <div class="t">${s.name}</div>
          <div class="s">${typeNames[s.license_type]} • ${s.phone}</div>
        </div>
      </div>
    `).join('');
}

loadTeachers();
loadBookings();
loadStudents();
</script>
</body>
</html>
