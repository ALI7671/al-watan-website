<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="الأسئلة الشائعة حول دروس السياقة، شروط الترخيص، والرسوم في مدرسة الوطن - رام الله.">
<title>الأسئلة الشائعة - مدرسة الوطن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2126;
    --ink-soft: #3A434B;
    --paper: #F6F3EC;
    --paper-dim: #EDE8DB;
    --route: #E9B93E;
    --olive: #4F6F52;
    --line: rgba(27,33,38,.14);
    --line-dark: rgba(246,243,236,.16);
    --wa-green: #25D366;
    --shadow-md: 0 12px 30px rgba(27,33,38,.10);
    --shadow-lg: 0 22px 48px rgba(27,33,38,.22);
    --shadow-gold: 0 0 0 2px var(--route), 0 26px 52px rgba(27,33,38,.28);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Cairo', 'Tajawal', Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }
  img { max-width: 100%; display: block; }

  /* ===== Navbar ===== */
  .navbar {
    background: var(--ink);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    position: sticky;
    top: 0;
    z-index: 500;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  .navbar .brand {
    color: var(--route);
    font-size: 17px;
    font-weight: 900;
    margin-left: auto;
    white-space: nowrap;
    letter-spacing: -.3px;
  }
  .navbar .nav-links {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
  }
  .navbar a {
    color: var(--paper);
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 800;
    position: relative;
    transition: color .2s ease;
  }
  .navbar a:hover { color: var(--route); }
  .nav-hidden { display: none !important; }
  .navbar a.active { color: var(--route); }
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--route);
    font-size: 26px;
    cursor: pointer;
    padding: 0 4px;
  }

  .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }

  /* ===== Section rhythm ===== */
  .section { padding: 84px 0; }
  .section-light { background: var(--paper); color: var(--ink); }
  .section-dark { background: var(--ink); color: var(--paper); }

  .reveal { opacity: 0; transform: translateY(38px); transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1); }
  .reveal.in-view { opacity: 1; transform: none; }

  .section-header { text-align: center; margin-bottom: 46px; }
  .section-header::after {
    content: '';
    display: block;
    width: 64px; height: 4px;
    background: var(--route);
    margin: 18px auto 0;
    border-radius: 4px;
  }

  h2 {
    font-size: 17px;
    margin: 0;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -.3px;
  }
  h2 .sub { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-top: 6px; }
  .section-header h2 { font-size: clamp(24px, 3.6vw, 36px); }
  .section-header h2 .sub { font-size: clamp(13.5px, 1.6vw, 16px); margin-top: 12px; }

  /* ===== Page hero ===== */
  .page-hero {
    background: var(--ink);
    color: var(--paper);
    text-align: center;
    padding: 76px 20px 64px;
    position: relative;
    overflow: hidden;
  }
  .page-hero::after {
    content: '❓';
    position: absolute;
    font-size: 240px;
    opacity: .05;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .page-hero h1 {
    position: relative;
    font-size: clamp(30px, 5.5vw, 50px);
    margin: 0 0 14px;
    font-weight: 900;
    letter-spacing: -.8px;
    color: var(--paper);
  }
  .page-hero h1 span { color: var(--route); }
  .page-hero p {
    position: relative;
    margin: 0 auto;
    max-width: 560px;
    font-size: clamp(14.5px, 1.8vw, 17px);
    font-weight: 700;
    color: #cbd5e1;
    line-height: 1.7;
  }

  /* ===== Accordion ===== */
  .faq-list { display: flex; flex-direction: column; gap: 12px; }
  .faq-item {
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    transition: box-shadow .3s ease, border-color .3s ease;
  }
  .faq-item.open { border-color: var(--route); box-shadow: var(--shadow-gold); }
  .faq-question {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    width: 100%;
    background: none;
    border: none;
    padding: 20px 22px;
    text-align: right;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 800;
    color: var(--ink);
    cursor: pointer;
  }
  .faq-question .q-icon {
    flex: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--paper-dim);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    font-weight: 900;
    transition: transform .3s cubic-bezier(.2,.8,.2,1), background .3s ease, color .3s ease;
  }
  .faq-item.open .faq-question .q-icon {
    background: var(--route);
    transform: rotate(135deg);
  }
  .faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s cubic-bezier(.2,.8,.2,1);
  }
  .faq-answer p {
    margin: 0;
    padding: 0 22px 20px;
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.8;
    font-weight: 600;
  }

  /* ===== WhatsApp floating button ===== */
  .wa-float {
    position: fixed;
    bottom: 24px;
    left: 20px;
    width: 60px; height: 60px;
    background: var(--wa-green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 22px rgba(37,211,102,.5);
    z-index: 900;
    text-decoration: none;
    animation: waPulse 2.2s infinite;
    transition: transform .2s ease;
  }
  .wa-float:hover { transform: scale(1.08); }
  .wa-float svg { width: 30px; height: 30px; }
  @keyframes waPulse {
    0% { box-shadow: 0 0 0 0 rgba(37,211,102,.6); }
    70% { box-shadow: 0 0 0 16px rgba(37,211,102,0); }
    100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
  }

  footer {
    background: var(--ink);
    color: #9AA4AB;
    text-align: center;
    padding: 26px 18px;
    font-size: 13px;
    font-weight: 700;
  }
  footer span { color: var(--route); }

  /* ===== Responsive ===== */
  @media (max-width: 760px) {
    .section { padding: 60px 0; }
  }
  @media (max-width: 640px) {
    .navbar .nav-links {
      display: none;
      position: absolute;
      top: 100%;
      right: 0; left: 0;
      background: var(--ink);
      flex-direction: column;
      align-items: flex-start;
      padding: 14px 20px 20px;
      gap: 16px;
      border-top: 1px solid rgba(246,243,236,.1);
    }
    .navbar .nav-links.open { display: flex; }
    .nav-toggle { display: block; }
    .navbar .brand { font-size: 15px; }
    .wa-float { width: 54px; height: 54px; left: 14px; bottom: 18px; }
    .page-hero { padding: 56px 18px 46px; }
    .faq-question { font-size: 14px; padding: 17px 18px; }
  }
</style>
</head>
<body>

<!-- شريط التنقل -->
<div class="navbar">
  <button class="nav-toggle" id="navToggle" aria-label="القائمة">☰</button>
  <span class="brand">🚗 مدرسة الوطن</span>
  <div class="nav-links" id="navLinks">
    <a href="/">الرئيسية</a>
    <a href="/#license-steps">خطوات الحصول على الرخصة</a>
    <a href="/login.html" id="navLogin">دخول الطالب</a>
    <a href="/dashboard.html" id="navAccount" class="nav-hidden">حسابي</a>
    <a href="#" id="navLogout" class="nav-hidden" onclick="return navStudentLogout(event)">خروج</a>
    <a href="/about.html">من نحن</a>
    <a href="/faq.html" class="active">الأسئلة الشائعة</a>
    <a href="/admin.html">الإدارة</a>
  </div>
</div>

<!-- عنوان الصفحة -->
<div class="page-hero">
  <h1>الأسئلة <span>الشائعة</span></h1>
  <p>إجابات على أبرز الاستفسارات المتعلقة بتعليم السياقة ورخص القيادة في مدرسة الوطن.</p>
</div>

<!-- قسم الأسئلة والأجوبة -->
<section class="section section-light">
  <div class="container reveal">
    <div class="section-header">
      <h2>عندك سؤال؟<span class="sub">اضغط على السؤال لعرض الجواب</span></h2>
    </div>
    <div class="faq-list" id="faqList"></div>
  </div>
</section>

<footer>مدرسة الوطن لتعليم السياقة — رام الله <span>★</span> جميع الحقوق محفوظة</footer>

<!-- زر واتساب عائم -->
<a class="wa-float" id="waFloat" href="#" target="_blank" aria-label="تواصل عبر واتساب">
  <svg viewBox="0 0 32 32" fill="#fff"><path d="M16.001 3C9.373 3 4 8.373 4 15c0 2.51.79 4.84 2.14 6.76L4.6 28.4l6.79-1.5A11.9 11.9 0 0 0 16 27c6.628 0 12-5.373 12-12S22.629 3 16.001 3zm0 21.6c-1.85 0-3.58-.5-5.07-1.37l-.36-.21-4.03.89.9-3.92-.24-.37A9.56 9.56 0 0 1 5.4 15c0-5.85 4.76-10.6 10.6-10.6S26.6 9.15 26.6 15 21.85 24.6 16 24.6zm5.83-7.94c-.32-.16-1.89-.93-2.18-1.04-.29-.11-.5-.16-.72.16-.21.32-.82 1.04-1 1.25-.19.21-.37.24-.68.08-.32-.16-1.34-.49-2.55-1.57-.94-.84-1.58-1.87-1.76-2.19-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.55.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.55-.08-.16-.72-1.74-.99-2.38-.26-.62-.53-.54-.72-.55h-.61c-.21 0-.55.08-.84.4-.29.32-1.1 1.08-1.1 2.63 0 1.55 1.13 3.05 1.29 3.26.16.21 2.22 3.39 5.38 4.75.75.32 1.34.52 1.79.66.75.24 1.44.21 1.98.13.6-.09 1.89-.77 2.16-1.51.27-.75.27-1.39.19-1.52-.08-.14-.29-.21-.61-.37z"/></svg>
</a>

<script>
const WA_PHONE = "972599254574";
document.getElementById('waFloat').href = `https://wa.me/${WA_PHONE}?text=${encodeURIComponent('مرحباً، بدي استفسر عن دروس السياقة بمدرسة الوطن')}`;

function navStudentLogout(e) {
  e.preventDefault();
  sessionStorage.removeItem('student');
  window.location.href = '/';
  return false;
}
(function() {
  const isLoggedIn = !!sessionStorage.getItem('student');
  document.getElementById('navLogin')?.classList.toggle('nav-hidden', isLoggedIn);
  document.getElementById('navAccount')?.classList.toggle('nav-hidden', !isLoggedIn);
  document.getElementById('navLogout')?.classList.toggle('nav-hidden', !isLoggedIn);
})();

document.getElementById('navToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

/* ===== بيانات الأسئلة الشائعة ===== */
const faqData = [
  { q: 'شو العمر القانوني لرخصة السيارة الخصوصي؟', a: '17 سنة.' },
  { q: 'شو العمر القانوني لرخصة الشحن؟', a: '17 سنة ونص (17.5).' },
  { q: 'كم درس بحتاج للحصول على الرخصة في الضفة؟', a: '15 درساً عملياً.' },
  { q: 'شو أنواع الرخص اللي بتعلّموها؟', a: 'نعلّم رخصة الأوتوماتيك، الجير العادي، والشحن الخفيف.' },
  { q: 'كم سعر الدرس؟', a: '110 شيكل لدرس الأوتوماتيك والجير، و130 شيكل لدرس الشحن الخفيف.' },
  { q: 'كيف بحجز درس؟', a: 'تقدر تحجز أونلاين من الموقع مباشرة، باختيار المعلم والتاريخ والوقت المناسب لك.' },
  { q: 'شو الأوراق المطلوبة للتسجيل؟', a: 'صورة عن الهوية الشخصية (أو هوية ولي الأمر لمن هم دون السن القانونية)، صورتان شخصيتان، فحص نظر، وتعبئة نموذج التسجيل في المدرسة.' },
];

function buildFaq() {
  const list = document.getElementById('faqList');
  list.innerHTML = faqData.map((item, i) => `
    <div class="faq-item" id="faq-${i}">
      <button class="faq-question" onclick="toggleFaq(${i})">
        <span>${item.q}</span>
        <span class="q-icon">+</span>
      </button>
      <div class="faq-answer" id="faq-answer-${i}">
        <p>${item.a}</p>
      </div>
    </div>
  `).join('');
}

function toggleFaq(i) {
  const item = document.getElementById(`faq-${i}`);
  const answer = document.getElementById(`faq-answer-${i}`);
  const isOpen = item.classList.contains('open');

  document.querySelectorAll('.faq-item.open').forEach(el => {
    el.classList.remove('open');
    el.querySelector('.faq-answer').style.maxHeight = null;
  });

  if (!isOpen) {
    item.classList.add('open');
    answer.style.maxHeight = answer.scrollHeight + 'px';
  }
}

function initReveal() {
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  els.forEach(el => io.observe(el));
}

buildFaq();
initReveal();
</script>
</body>
</html>
