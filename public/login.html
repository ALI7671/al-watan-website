<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - مدرسة الوطن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2126;
    --ink-soft: #3A434B;
    --paper: #F6F3EC;
    --paper-card: #FFFFFF;
    --route: #E9B93E;
    --rust: #B3492B;
    --rust-soft: #F3E0D8;
    --line: rgba(27,33,38,.10);
    --shadow: 0 30px 70px rgba(0,0,0,.45), 0 0 0 6px rgba(233,185,62,.08);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Cairo', 'Tajawal', Arial, sans-serif;
    background: var(--ink);
    color: var(--ink);
    margin: 0;
    padding: 0;
  }
  .navbar {
    background: var(--ink);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    position: sticky;
    top: 0;
    z-index: 500;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }
  .navbar .brand { color: var(--route); font-size: 17px; font-weight: 900; margin-left: auto; white-space: nowrap; letter-spacing: -.3px; }
  .navbar .nav-links { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .navbar a { color: var(--paper); text-decoration: none; font-size: 14.5px; font-weight: 800; transition: color 0.2s; }
  .navbar a:hover { color: var(--route); }
  .nav-toggle { display: none; background: none; border: none; color: var(--route); font-size: 26px; cursor: pointer; padding: 0 4px; }
  @media (max-width: 640px) {
    .navbar .nav-links {
      display: none; position: absolute; top: 100%; right: 0; left: 0;
      background: var(--ink); flex-direction: column; align-items: flex-start;
      padding: 14px 20px 20px; gap: 16px; border-top: 1px solid rgba(246,243,236,.1);
    }
    .navbar .nav-links.open { display: flex; }
    .nav-toggle { display: block; }
    .navbar .brand { font-size: 15px; }
  }

  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1); }
  .reveal.in-view { opacity: 1; transform: none; }

  /* ===== خلفية داكنة كاملة مع سيارة خافتة ===== */
  .login-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 72px);
    padding: 56px 18px 70px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 600px at 12% -8%, rgba(233,185,62,.20), transparent 60%),
      radial-gradient(ellipse 700px 550px at 105% 112%, rgba(233,185,62,.12), transparent 60%),
      var(--ink);
  }
  .login-wrap::before {
    content: '🚗';
    position: absolute;
    font-size: 560px;
    line-height: 1;
    bottom: -160px;
    left: -110px;
    opacity: .05;
    color: var(--route);
    transform: rotate(-10deg);
    pointer-events: none;
    user-select: none;
  }

  /* ===== شعار ونص ترحيبي ضخم فوق الفورم ===== */
  .login-hero { text-align: center; margin-bottom: 38px; position: relative; z-index: 1; }
  .brand-badge {
    width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 22px;
    background: var(--route); display: flex; align-items: center; justify-content: center;
    font-size: 34px; box-shadow: 0 14px 34px rgba(233,185,62,.4);
    animation: badgePulse 2.6s ease-in-out infinite;
  }
  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 14px 34px rgba(233,185,62,.4); }
    50% { box-shadow: 0 14px 46px rgba(233,185,62,.65); }
  }
  .login-hero h1 {
    color: #fff;
    font-size: clamp(34px, 7vw, 58px);
    font-weight: 900;
    margin: 0 0 12px;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .login-hero h1 span { color: var(--route); }
  .login-hero .tagline {
    color: #C7CDD2;
    font-size: 15px;
    font-weight: 600;
    margin: 0 auto;
    max-width: 420px;
  }

  /* ===== بطاقة الفورم البارزة ===== */
  .login-box {
    background: var(--paper-card);
    border: 2.5px solid var(--route);
    border-radius: 26px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
    z-index: 1;
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .login-box:hover { transform: translateY(-6px); box-shadow: 0 40px 80px rgba(0,0,0,.5), 0 0 0 6px rgba(233,185,62,.16); }

  .road {
    height: 100px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--ink) 0%, #2A333B 100%);
    margin-bottom: 26px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
  }
  .road .strip {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    height: 4px;
    background-image: repeating-linear-gradient(90deg, var(--route) 0 22px, transparent 22px 40px);
    animation: drive 1.4s linear infinite;
  }
  @keyframes drive { from { background-position: 0 0; } to { background-position: -62px 0; } }
  .road .car { position: absolute; bottom: 30px; right: 34px; font-size: 26px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

  .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 26px 0; font-weight: 700; }

  label {
    display: block;
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--ink-soft);
  }
  input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    font-size: 15px;
    margin-bottom: 20px;
    font-family: inherit;
    background: #faf8f5;
    transition: all 0.2s ease;
  }
  input:focus { outline: none; background: #fff; border-color: var(--route); box-shadow: 0 0 0 3px rgba(233, 185, 62, 0.15); }

  button {
    background: var(--route);
    color: var(--ink);
    border: none;
    border-radius: 13px;
    padding: 17px;
    font-size: 16px;
    font-weight: 800;
    width: 100%;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 12px 26px rgba(233,185,62,.35);
    transition: transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, background 0.2s ease;
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }
  button::after {
    content: '';
    position: absolute; inset: 0 auto 0 -60%;
    width: 50%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.6), transparent);
    transform: skewX(-20deg);
    transition: left .6s ease;
  }
  button:hover::after { left: 130%; }
  button:hover { background: #f0c458; transform: translateY(-3px) scale(1.02); box-shadow: 0 18px 36px rgba(233,185,62,.5); }
  button:active { transform: scale(0.97); }

  .msg { padding: 13px; border-radius: 10px; margin-bottom: 20px; display: none; font-size: 14px; font-weight: 700; }
  .msg.error { background: var(--rust-soft); color: var(--rust); display: block; border: 1px solid rgba(179,73,43,0.15); }
</style>
</head>
<body>

<div class="navbar">
  <button class="nav-toggle" id="navToggle" aria-label="القائمة">☰</button>
  <span class="brand">🚗 مدرسة الوطن</span>
  <div class="nav-links" id="navLinks">
    <a href="/">الرئيسية</a>
    <a href="/login.html">دخول الطالب</a>
    <a href="/dashboard.html">حسابي</a>
    <a href="/about.html">من نحن</a>
    <a href="/faq.html">الأسئلة الشائعة</a>
    <a href="/admin.html">الإدارة</a>
  </div>
</div>

<div class="login-wrap">
  <div class="login-hero reveal">
    <div class="brand-badge">🚗</div>
    <h1>مدرسة <span>الوطن</span></h1>
    <p class="tagline">خطوتك الأولى نحو رخصة القيادة تبدأ من هون</p>
  </div>

  <div class="login-box reveal">
    <div class="road">
      <div class="strip"></div>
      <div class="car">🚗</div>
    </div>

    <p class="sub">سجّل دخولك برقم موبايلك</p>

    <div id="loginMessage" class="msg"></div>

    <label>رقم الموبايل</label>
    <input type="tel" id="loginPhone" placeholder="0599123456">

    <button onclick="login()">دخول</button>
  </div>
</div>

<script>
document.getElementById('navToggle').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

const revealEls = document.querySelectorAll('.reveal');
const revealIO = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) { entry.target.classList.add('in-view'); revealIO.unobserve(entry.target); }
  });
}, { threshold: 0.12 });
revealEls.forEach(el => revealIO.observe(el));

async function login() {
  const phone = document.getElementById('loginPhone').value.trim();
  const msgEl = document.getElementById('loginMessage');

  if (!phone) {
    msgEl.className = 'msg error';
    msgEl.textContent = 'يرجى إدخال رقم الموبايل';
    return;
  }

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone })
  });

  const result = await res.json();

  if (result.success) {
    sessionStorage.setItem('student', JSON.stringify(result.student));
    window.location.href = '/dashboard.html';
  } else {
    msgEl.className = 'msg error';
    msgEl.textContent = result.message;
  }
}
</script>
</body>
</html>
