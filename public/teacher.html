<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المعلم - مدرسة الوطن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2126;
    --ink-soft: #3A434B;
    --paper: #F6F3EC;
    --paper-dim: #EDE8DB;
    --route: #E9B93E;
    --olive: #4F6F52;
    --olive-soft: #E4EAE2;
    --rust: #B3492B;
    --rust-soft: #F3E0D8;
    --line: rgba(27,33,38,.14);
    --shadow-md: 0 12px 30px rgba(27,33,38,.10);
    --shadow-gold: 0 0 0 2px var(--route), 0 22px 44px rgba(27,33,38,.22);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Cairo', 'Tajawal', Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    padding: 0 0 40px 0;
  }
  .navbar {
    background: var(--ink);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    position: sticky;
    top: 0;
    z-index: 500;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  .navbar .brand { color: var(--route); font-size: 17px; font-weight: 900; margin-left: auto; white-space: nowrap; }
  .navbar a { color: var(--paper); text-decoration: none; font-size: 14.5px; font-weight: 800; }
  .navbar a:hover { color: var(--route); }

  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1); }
  .reveal.in-view { opacity: 1; transform: none; }

  .container { max-width: 900px; margin: 0 auto; padding: 0 18px; }

  /* ===== هيرو المعلم ===== */
  .hero {
    background: linear-gradient(135deg, var(--ink) 0%, #2A333B 100%);
    color: var(--paper);
    border-radius: 0 0 40px 40px;
    padding: 54px 28px 46px;
    margin-bottom: 30px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    row-gap: 20px;
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '👨‍🏫';
    position: absolute;
    font-size: 200px;
    line-height: 1;
    bottom: -60px;
    left: -10px;
    opacity: .06;
    color: var(--route);
    transform: rotate(-8deg);
    pointer-events: none;
    user-select: none;
  }
  .hero-info { display: flex; align-items: center; gap: 18px; position: relative; z-index: 1; }
  .hero-avatar {
    width: 70px; height: 70px; border-radius: 50%; background: var(--route); color: var(--ink);
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px;
    flex-shrink: 0; box-shadow: 0 10px 24px rgba(233,185,62,.4);
  }
  .hero .greeting { font-size: 14px; color: #B7C0C7; font-weight: 700; margin-bottom: 4px; }
  .hero .name { font-size: clamp(24px, 6vw, 36px); font-weight: 900; letter-spacing: -.5px; line-height: 1.1; }
  .hero .type {
    display: inline-block; font-size: 12.5px; color: var(--route); margin-top: 10px; font-weight: 800;
    background: rgba(233,185,62,.14); padding: 5px 14px; border-radius: 20px;
  }
  .logout {
    background: transparent;
    border: 1.5px solid rgba(246,243,236,.3);
    color: var(--paper);
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
    transition: all .2s ease;
    position: relative; z-index: 1;
  }
  .logout:hover { background: var(--route); border-color: var(--route); color: var(--ink); transform: translateY(-2px); }
  @media (max-width: 480px) {
    .hero { flex-direction: column; align-items: flex-start; padding: 44px 22px 36px; }
    .logout { align-self: flex-end; }
  }

  /* ===== ملخص الشهر ===== */
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 34px; }
  @media (max-width: 480px) { .summary-grid { grid-template-columns: 1fr; } }
  .summary-card { border-radius: 18px; padding: 22px 18px; text-align: center; box-shadow: var(--shadow-md); color: #fff; transition: transform .25s ease, box-shadow .25s ease; }
  .summary-card:hover { transform: translateY(-5px); }
  .summary-card .value { font-size: 27px; font-weight: 900; }
  .summary-card .label { font-size: 12.5px; margin-top: 6px; font-weight: 700; opacity: .92; }
  .summary-card.lessons { background: linear-gradient(135deg, var(--ink), #2A333B); border: 2px solid var(--route); }
  .summary-card.lessons .value { color: var(--route); }
  .summary-card.income { background: linear-gradient(135deg, var(--olive), #3d5a40); }

  /* ===== رؤوس الأقسام ===== */
  .section-head { display: flex; align-items: center; gap: 14px; margin: 36px 0 16px; }
  .section-icon {
    width: 52px; height: 52px; border-radius: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; box-shadow: 0 10px 22px rgba(27,33,38,.14);
  }
  .icon-gold { background: var(--route); color: var(--ink); }
  .icon-olive { background: var(--olive); color: #fff; }
  h2 { font-size: 19px; margin: 0; font-weight: 900; letter-spacing: -.2px; }
  .section-sub { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; }

  .empty {
    color: var(--ink-soft); font-size: 14px; padding: 26px 18px; text-align: center;
    background: #fff; border: 1.5px dashed var(--line); border-radius: 16px;
  }

  /* ===== بطاقات الحجوزات ===== */
  .bookings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
  .booking-card { background: #fff; border: 1px solid var(--line); border-top: 5px solid var(--route); border-radius: 16px; padding: 18px; box-shadow: 0 8px 20px rgba(27,33,38,.06); transition: box-shadow .25s ease, transform .25s ease; }
  .booking-card:hover { box-shadow: var(--shadow-gold); transform: translateY(-3px); }
  .booking-card.is-done { border-top-color: var(--olive); opacity: .9; }
  .booking-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .booking-student { font-weight: 800; font-size: 14.5px; }
  .booking-detail { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 7px; }
  .booking-detail strong { color: var(--ink); font-weight: 700; }
  .booking-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .mini-btn { flex: 1; min-width: 100px; background: var(--paper-dim); color: var(--ink); border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 10px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .2s ease; }
  .mini-btn:hover { border-color: var(--route); background: #fff; transform: translateY(-1px); }
  .mini-btn.gold { background: var(--route); color: var(--ink); border-color: var(--route); }
  .mini-btn.gold:hover { background: #f0c458; box-shadow: 0 6px 16px rgba(233,185,62,.4); }
  .mini-btn.olive { background: var(--olive); color: #fff; border-color: var(--olive); }
  .mini-btn.olive:hover { background: #3d5a40; box-shadow: 0 6px 16px rgba(79,111,82,.4); }

  .pill { font-size: 11px; font-weight: 800; padding: 5px 11px; border-radius: 20px; display: inline-block; white-space: nowrap; }
  .pill-paid { background: var(--olive-soft); color: var(--olive); }
  .pill-partial { background: rgba(233,185,62,.18); color: #8a6612; }
  .pill-unpaid { background: var(--rust-soft); color: var(--rust); }
  .pill-done { background: var(--olive-soft); color: var(--olive); }

  /* ===== نافذة منبثقة ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(27,33,38,.72); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 3000;
    opacity: 0; pointer-events: none; transition: opacity .25s ease; padding: 20px;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: #fff; border-radius: 20px; width: 100%; max-width: 400px;
    box-shadow: 0 30px 60px rgba(0,0,0,.35); border-top: 5px solid var(--route);
    transform: translateY(20px) scale(.97); transition: transform .25s ease; overflow: hidden;
  }
  .modal-overlay.open .modal-box { transform: translateY(0) scale(1); }
  .modal-header { background: var(--ink); padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; }
  .modal-header span { font-weight: 800; font-size: 16px; color: var(--route); }
  .modal-close { background: none; border: none; color: var(--paper); font-size: 22px; cursor: pointer; line-height: 1; padding: 0; }
  .modal-close:hover { color: var(--route); }
  .modal-body { padding: 22px; }
  .modal-body label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; color: var(--ink-soft); }
  .modal-body input {
    width: 100%; padding: 13px; border-radius: 10px; border: 1.5px solid var(--line);
    font-family: inherit; font-size: 15px; margin-bottom: 16px; background: #faf8f5;
  }
  .modal-body input:focus { outline: none; border-color: var(--route); box-shadow: 0 0 0 3px rgba(233,185,62,.18); background: #fff; }
  .modal-body p { margin: 0 0 22px; font-size: 14.5px; color: var(--ink-soft); line-height: 1.7; }
  .modal-error { color: var(--rust); background: var(--rust-soft); padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .modal-btn {
    background: var(--route); color: var(--ink); border: none; border-radius: 12px;
    padding: 14px; font-size: 15px; font-weight: 800; width: 100%; cursor: pointer;
    font-family: inherit; transition: all .2s ease; box-shadow: 0 8px 18px rgba(233,185,62,.35);
  }
  .modal-btn:hover { background: #f0c458; transform: translateY(-2px); box-shadow: 0 12px 24px rgba(233,185,62,.45); }
  .modal-btn:active { transform: scale(.97); }
</style>
</head>
<body>

<div class="navbar">
  <a href="/" style="margin-left:auto;order:2;">الرئيسية</a>
  <span class="brand" style="order:1;">🚗 مدرسة الوطن</span>
</div>

<div class="hero">
  <div class="hero-info">
    <div class="hero-avatar" id="teacherAvatar">؟</div>
    <div>
      <div class="greeting">مرحباً بعودتك 👋</div>
      <div class="name" id="teacherName">...</div>
      <div class="type" id="teacherType">...</div>
    </div>
  </div>
  <button class="logout" onclick="logout()">خروج</button>
</div>

<div class="container">
  <div class="summary-grid reveal">
    <div class="summary-card lessons"><div class="value" id="sumLessons">0</div><div class="label">دروس مكتملة هالشهر</div></div>
    <div class="summary-card income"><div class="value" id="sumCollected">0 ₪</div><div class="label">المبلغ المحصّل هالشهر</div></div>
  </div>

  <div class="reveal">
    <div class="section-head">
      <div class="section-icon icon-gold">📅</div>
      <div>
        <h2>الحجوزات القادمة</h2>
        <div class="section-sub">دروسك المحجوزة، مرتّبة حسب الأقرب</div>
      </div>
    </div>
    <div id="upcomingBookings">جاري التحميل...</div>
  </div>

  <div class="reveal">
    <div class="section-head">
      <div class="section-icon icon-olive">✅</div>
      <div>
        <h2>الدروس المكتملة</h2>
        <div class="section-sub">الدروس اللي خلصتها مع الطلاب</div>
      </div>
    </div>
    <div id="doneBookings">جاري التحميل...</div>
  </div>
</div>

<!-- نافذة تسجيل الدفعة -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modalTitle">تسجيل دفعة</span>
      <button class="modal-close" onclick="closeModal()" aria-label="إغلاق">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const typeNames = { automatic: 'أوتوماتيك', manual: 'جير', heavy: 'شحن خفيف' };

const teacher = JSON.parse(sessionStorage.getItem('teacher') || 'null');
if (!teacher) window.location.href = '/teacher-login.html';

document.getElementById('teacherName').textContent = teacher.name;
document.getElementById('teacherType').textContent = `يعلّم: ${(teacher.types || '').split(',').map(t => typeNames[t] || t).join(' • ')}`;
document.getElementById('teacherAvatar').textContent = teacher.name.charAt(0);

const revealEls = document.querySelectorAll('.reveal');
const revealIO = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) { entry.target.classList.add('in-view'); revealIO.unobserve(entry.target); }
  });
}, { threshold: 0.12 });
revealEls.forEach(el => revealIO.observe(el));

function logout() {
  sessionStorage.removeItem('teacher');
  window.location.href = '/teacher-login.html';
}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;');
}

function paymentPillHtml(b) {
  const collected = b.collected_amount || 0;
  if (collected >= b.price) return `<span class="pill pill-paid">مدفوع بالكامل</span>`;
  if (collected > 0) return `<span class="pill pill-partial">مدفوع جزئياً (${collected} ₪)</span>`;
  return `<span class="pill pill-unpaid">لم يُدفع بعد</span>`;
}

function bookingCardHtml(b, isDone) {
  const actions = isDone ? '' : `
    <div class="booking-actions">
      <button class="mini-btn gold" data-action="collect" data-id="${b.id}" data-student="${escapeAttr(b.student_name)}" data-current="${b.collected_amount || 0}">كم قبضت؟</button>
      <button class="mini-btn olive" data-action="complete" data-id="${b.id}">تم</button>
    </div>`;
  return `
    <div class="booking-card${isDone ? ' is-done' : ''}">
      <div class="booking-card-head">
        <span class="booking-student">${escapeHtml(b.student_name)}</span>
        ${paymentPillHtml(b)}
      </div>
      <div class="booking-detail"><span>نوع الدرس</span><strong>${typeNames[b.lesson_type] || b.lesson_type}</strong></div>
      <div class="booking-detail"><span>التاريخ</span><strong>${b.date}</strong></div>
      <div class="booking-detail"><span>الوقت</span><strong>${b.time}</strong></div>
      <div class="booking-detail"><span>السعر</span><strong>${b.price} ₪</strong></div>
      ${isDone ? `<div class="booking-detail"><span>الحالة</span><span class="pill pill-done">تم الدرس</span></div>` : ''}
      ${actions}
    </div>`;
}

async function loadDashboard() {
  const res = await fetch(`/api/teacher/${teacher.id}/dashboard`);
  const result = await res.json();

  if (!result.success) {
    logout();
    return;
  }

  const bookings = result.bookings || [];
  const upcoming = bookings.filter(b => b.status !== 'done').sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const done = bookings.filter(b => b.status === 'done').sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));

  document.getElementById('upcomingBookings').innerHTML = upcoming.length === 0
    ? '<div class="empty">ما في حجوزات قادمة حالياً</div>'
    : `<div class="bookings-grid">${upcoming.map(b => bookingCardHtml(b, false)).join('')}</div>`;

  document.getElementById('doneBookings').innerHTML = done.length === 0
    ? '<div class="empty">ما في دروس مكتملة بعد</div>'
    : `<div class="bookings-grid">${done.map(b => bookingCardHtml(b, true)).join('')}</div>`;

  document.getElementById('sumLessons').textContent = result.summary.lessonsThisMonth;
  document.getElementById('sumCollected').textContent = result.summary.collectedThisMonth + ' ₪';
}

/* ===== النافذة المنبثقة ===== */
function openModal(title, bodyHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
function showModalError(text) {
  const el = document.getElementById('modalError');
  if (!el) return;
  el.textContent = text;
  el.style.display = 'block';
}

function openCollectModal(id, studentName, current) {
  openModal(`كم قبضت من ${studentName}؟`, `
    <label>المبلغ المحصّل (₪)</label>
    <input type="number" id="collectAmount" placeholder="مثال: 110" min="0" value="${current || ''}">
    <div id="modalError" class="modal-error"></div>
    <button class="modal-btn" onclick="submitCollect(${id})">حفظ المبلغ</button>
  `);
}

async function submitCollect(id) {
  const amount = parseInt(document.getElementById('collectAmount').value, 10);

  if (isNaN(amount) || amount < 0) {
    showModalError('يرجى إدخال مبلغ صحيح');
    return;
  }

  const res = await fetch(`/api/teacher/${teacher.id}/bookings/${id}/collect`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ collected_amount: amount })
  });
  const result = await res.json();

  if (result.success) {
    closeModal();
    loadDashboard();
  } else {
    showModalError(result.message || 'صار خطأ أثناء الحفظ');
  }
}

async function completeBooking(id) {
  await fetch(`/api/teacher/${teacher.id}/bookings/${id}/complete`, { method: 'PUT' });
  loadDashboard();
}

function handleBookingAction(e) {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const { action, id, student, current } = btn.dataset;
  if (action === 'collect') openCollectModal(id, student, current);
  else if (action === 'complete') completeBooking(id);
}
['upcomingBookings', 'doneBookings'].forEach(id => {
  document.getElementById(id).addEventListener('click', handleBookingAction);
});

if (teacher) loadDashboard();
</script>
</body>
</html>
